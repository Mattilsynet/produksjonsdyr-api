name: Upgrade Gradle Wrapper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * SUN"

jobs:
  update-gradle-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Update Gradle Wrapper
        uses: gradle-update/update-gradle-wrapper-action@512b1875f3b6270828abfe77b247d5895a2da1e5 # v2.1.0
        with:
          target-branch: master
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          pr-title-template: 'gradle: bump gradle wrapper from %sourceVersion% to %targetVersion%'